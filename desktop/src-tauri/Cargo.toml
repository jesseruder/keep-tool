[package]
name = "keep-desktop"
version = "0.1.0"
description = "Native macOS shell for the Keep console"
edition = "2021"

[[bin]]
name = "keep-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-notification = "2.4"
