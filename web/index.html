    <select id="afKind"><option>task</option><option>experiment</option><option>idea</option><option>chore</option><option>bug</option></select></div>
  <div class="field"><label>Status</label>
    <select id="afStatus"><option>inbox</option><option>active</option><option>waiting</option><option>blocked</option><option>landing</option><option>review</option></select></div>
  <div class="field"><label>Tags (space-separated)</label><input type="text" id="afTags"></div>
  <div class="field"><label>Project path</label><input type="text" id="afProject" placeholder="~/castle/…"></div>
  <div class="field"><label>Check after (for experiments: YYYY-MM-DD, +3d, tomorrow)</label><input type="text" id="afCheckAfter"></div>
  <div class="field"><label>Check recipe</label><textarea id="afCheck" placeholder="What an agent should do to check on this, cold."></textarea></div>
  <div class="field"><label>Note</label><textarea id="afNote"></textarea></div>
  <div class="actions"><button class="btn" id="afSubmit">Add task</button></div>
</dialog>
<div id="toast"></div>

<script type="module">
import { modelUsageHTML } from "/app/model-usage.js";
window.modelUsageHTML = modelUsageHTML;
</script>
<script>
'use strict';
const COLS = ['active', 'review', 'landing', 'blocked', 'waiting', 'inbox'];
const STALE_DAYS = 7;
let state = { tasks: [], sessions: [], attention: [], stalled: [], unblocked: [], alerts: [], brief: null, standup: null, landed: {}, slack: null, health: null, digest: null, runs: [], usage: {}, reviewUsage: null };
let tagFilter = null;
let scopeFilter = localStorage.keepScope || null;
const scopeNames = () => state.scopes?.names || ['work', 'personal'];
let kindFilter = localStorage.keepKind === 'experiment' ? 'experiment' : null;
let attentionView = ['focus', 'list'].includes(localStorage.keepAttnView) ? localStorage.keepAttnView : 'focus';
let attentionMax = localStorage.keepAttnMax === '1';
let focusPinned = null;
let tagSummary = null;

const $ = (id) => document.getElementById(id);
let openTaskId = null;
let taskDetailRequest = 0;

const sessionOpenStates = new Map();
function sessionOpenButton(payload) {
  const key = JSON.stringify(payload);
  const status = sessionOpenStates.get(key) || {};
  return `<button type="button" class="chip" data-session-open="${esc(key)}" ${status.busy ? 'disabled' : ''}>Open session</button><span class="session-open-result" role="status">${esc(status.text || '')}</span>`;
}

function updateSessionOpenState(key, status) {
  sessionOpenStates.set(key, status);
  for (const button of document.querySelectorAll('[data-session-open]')) {
    if (button.dataset.sessionOpen !== key) continue;
    button.disabled = status.busy;
    button.nextElementSibling.textContent = status.text;
  }
}

document.addEventListener('click', async (event) => {
  const button = event.target.closest('[data-session-open]');
  if (!button) return;
  event.stopPropagation();
  const key = button.dataset.sessionOpen;
  if (button.disabled || sessionOpenStates.get(key)?.busy) return;
  updateSessionOpenState(key, { busy: true, text: 'Opening…' });
  try {
    const result = await post('/api/open', JSON.parse(key));
    updateSessionOpenState(key, { busy: false, text: result.existing ? `Running in ${result.pane}` : `Opened ${result.pane || 'session'}` });
  } catch (e) { updateSessionOpenState(key, { busy: false, text: e.message }); }
}, true);

async function post(pathname, body) {
  const r = await fetch(pathname, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-keep': '1' },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) {
    const error = new Error(String(j.error || `request failed (${r.status})`).slice(0, 300));
    error.data = j;
    throw error;
  }
  return j;
}

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').style.display = 'none'; }, 3500);
}

function runFor(taskId) {
  return (state.runs || []).find((r) => r.taskId === taskId);
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const experimentChip = (id) => id ? `<span class="experiment-chip">🧪 ${esc(id)}</span>` : '';

function md(src) {
  // tiny renderer for digests, assistant messages, and logs
  const lines = String(src).split('\n');
  let out = '', listType = '';
  const closeList = () => {
    if (listType) out += `</${listType}>`;
    listType = '';
  };
  const openList = (type) => {
    if (listType === type) return;
    closeList();
    out += `<${type}>`;
    listType = type;
  };
  const inline = (text) => esc(text).replace(
    /`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|\*\*([^*]+?)\*\*|(^|[^*])\*([^*]+?)\*(?!\*)/g,
    (match, code, linkText, url, bold, lead, italic) => {
      if (code !== undefined) return `<code>${code}</code>`;
      if (linkText !== undefined) {
        return /^https?:\/\//i.test(url)
          ? `<a href="${url}" target="_blank" rel="noopener">${linkText}</a>`
          : match;
      }
      if (bold !== undefined) return `<b>${bold}</b>`;
      return `${lead}<i>${italic}</i>`;
    },
  );
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      closeList();
      const code = [];
      for (i += 1; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) code.push(lines[i]);
      out += `<pre class="mdcode">${esc(code.join('\n'))}</pre>`;
      continue;
    }
    // degrade markdown tables (which we don't render) into bullets
    if (/^\s*\|/.test(l)) {
      if (/^\s*[|:\s-]+$/.test(l)) continue; // separator row
      if (i + 1 < lines.length && /^\s*\|[|:\s-]+$/.test(lines[i + 1])) continue; // header row
      const cells = l.split('|').map((c) => c.trim()).filter(Boolean);
      if (cells.length) {
        openList('ul');
        out += `<li>${esc(cells.join(' — '))}</li>`;
      }
      continue;
    }
    if (/^### /.test(l)) { closeList(); out += `<h3>${inline(l.slice(4))}</h3>`; }
    else if (/^## /.test(l)) { closeList(); out += `<h2>${inline(l.slice(3))}</h2>`; }
    else if (/^# /.test(l)) { closeList(); out += `<h1>${inline(l.slice(2))}</h1>`; }
    else if (/^- /.test(l)) { openList('ul'); out += `<li>${inline(l.slice(2))}</li>`; }
    else if (/^\d+\. /.test(l)) { openList('ol'); out += `<li>${inline(l.replace(/^\d+\. /, ''))}</li>`; }
    else if (/^> /.test(l)) { closeList(); out += `<blockquote>${inline(l.slice(2))}</blockquote>`; }
    else { closeList(); if (l.trim()) out += `<p>${inline(l)}</p>`; }
  }
  closeList();
  return out;
}

function ago(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 90) return `${s}s ago`;
  if (s < 5400) return `${Math.round(s / 60)}m ago`;
  return `${Math.round(s / 3600)}h ago`;
}

function projName(p) { return p ? p.split('/').filter(Boolean).pop() : ''; }

function attentionTime(since) {
  const ms = typeof since === 'number' ? since : new Date(since).getTime();
  return Number.isFinite(ms) ? ago(ms) : '';
}

function pacificTime(value) {
  const date = new Date(value);
  if (!Number.isFinite(date.getTime())) return 'unknown';
  return new Intl.DateTimeFormat(undefined, {
    timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
  }).format(date) + ' PT';
}

function usageResetTitle(resetsAt) {
  const date = new Date(resetsAt);
  if (!Number.isFinite(date.getTime())) return '';
  return `resets ${date.toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`;
}

function usagePill(limit, useSeverity) {
  const percent = Number(limit && limit.percent);
  if (!Number.isFinite(percent)) return '';
  const elevated = useSeverity && limit.severity && limit.severity !== 'normal';
  const level = percent >= 90 ? ' hot' : percent >= 70 || elevated ? ' warm' : '';
  const reset = usageResetTitle(limit.resetsAt);
  const title = `${Math.round(percent)}% of limit used${reset ? ` — ${reset}` : ''}`;
  return `<span class="usage-pill${level}" title="${esc(title)}">${esc(limit.label)} ${Math.round(percent)}%</span>`;
}

function renderUsage() {
  const usage = state.usage || {};
  const groups = [];
  const claudeLimits = usage.claude && Array.isArray(usage.claude.limits) ? usage.claude.limits : [];
  const claudePills = claudeLimits.map((limit) => usagePill(limit, true)).filter(Boolean);
  if (claudePills.length) {
    const fetchedAt = Number(usage.claude.fetchedAt);
    const age = Number.isFinite(fetchedAt) ? Math.max(0, Date.now() - fetchedAt) : 0;
    const suffix = age >= 10 * 60e3
      ? `<span class="usage-asof" title="${esc(usage.claude.error || '')}">(as of ${esc(ago(fetchedAt))})</span>` : '';
    groups.push(`<span class="usage-source"><span class="usage-name">Claude</span><span>·</span>${claudePills.join('<span>·</span>')}${suffix}</span>`);
  } else if (usage.claude && usage.claude.error) {
    groups.push(`<span class="usage-source"><span class="usage-name">Claude</span><span>·</span><span class="usage-pill" title="${esc(usage.claude.error)}">unavailable</span></span>`);
  }
  const ru = state.reviewUsage;
  if (ru && ru.today && (ru.today.msgs || ru.week.msgs)) {
    const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
    const spent = (d) => (d.in || 0) + (d.cc || 0); // fresh input tokens; cache reads are cheap and shown separately
    const w = ru.weekly;
    let weeklyText = '';
    let weeklyTitle = '';
    if (w && w.pointsOfModelWeek !== undefined) {
      // same units as the "Fable wk N%" pill: percent of that weekly window consumed
      weeklyText = `${w.pointsOfModelWeek.toFixed(1)}%`;
      weeklyTitle = `\n~${w.pointsOfModelWeek.toFixed(1)}% of the ${w.modelLabel.replace(/ wk$/, '')} weekly window (of ${w.modelPercent}% used in total)`;
    } else if (w && w.pointsOfWeek !== undefined) {
      weeklyText = `${w.pointsOfWeek.toFixed(1)}%`;
      weeklyTitle = `\n~${w.pointsOfWeek.toFixed(1)}% of the weekly window (of ${w.weekPercent}% used in total)`;
    }
    if (w && w.warming) weeklyTitle += `\n(still folding ${Math.round((w.backlogBytes || 0) / 1e6)}MB of history - the estimate will settle)`;
    if (w) weeklyTitle += `\nusage from other devices/cloud is not visible locally, so this reads slightly high`;
    const title = `Fleet reviewer, estimated from its session transcripts.\n`
      + `today: ${fmt(spent(ru.today))} input + ${fmt(ru.today.out || 0)} out (+${fmt(ru.today.cr || 0)} cache reads, ${ru.today.msgs || 0} msgs)\n`
      + `7 days: ${fmt(spent(ru.week))} input + ${fmt(ru.week.out || 0)} out (+${fmt(ru.week.cr || 0)} cache reads, ${ru.week.msgs || 0} msgs)`
      + (ru.models && ru.models.length ? `\nmodel: ${ru.models.join(', ')}` : '')
      + weeklyTitle;
    const label = weeklyText ? `${esc(weeklyText)}${w && w.warming ? '…' : ''}` : `today ${esc(fmt(spent(ru.today)))}+${esc(fmt(ru.today.out || 0))}`;
    const pill = `<span class="usage-pill" title="${esc(title)}">${label}</span>`;
    groups.push(`<span class="usage-source"><span class="usage-name">Reviewer</span><span>·</span>${pill}</span>`);
  }
  const codexWindows = usage.codex && Array.isArray(usage.codex.windows) ? usage.codex.windows : [];
  const codexPills = codexWindows.map((limit) => usagePill(limit, false)).filter(Boolean);
  if (codexPills.length) {
    const asOf = Number(usage.codex.asOf);
    const age = Number.isFinite(asOf) ? Math.max(0, Date.now() - asOf) : 0;
    const suffix = age >= 10 * 60e3 ? `<span class="usage-asof">(as of ${esc(ago(asOf))})</span>` : '';
    groups.push(`<span class="usage-source"><span class="usage-name">Codex</span><span>·</span>${codexPills.join('<span>·</span>')}${suffix}</span>`);
  }
  $('usage').innerHTML = groups.join('');
}

function renderDaemon() {
  const health = state.health;
  const presentation = (row) => {
    const unresolved = row.state !== 'disabled' && Number(row.consecutiveFailures || 0) > 0 && new Date(row.lastErrorAt || 0).getTime() > new Date(row.lastOkAt || 0).getTime();
    const displayState = row.displayState || (unresolved && Number(row.consecutiveFailures) < 3 && ['ok', 'skipped'].includes(row.state) ? 'warning' : row.state);
    const displayDetail = row.displayDetail ?? (unresolved ? row.lastError : row.detail || '');
    return { ...row, displayState, displayDetail };
  };
  const rows = health && Array.isArray(health.schedulers) ? health.schedulers.map(presentation) : [];
  $('daemonBox').style.display = health ? '' : 'none';
  if (!health) return;
  const badStates = new Set(['failing', 'silent', 'never']);
  const bad = rows.filter((row) => badStates.has(row.displayState));
  const warnings = rows.filter((row) => row.displayState === 'warning');
  const uptime = health.daemon && health.daemon.startedAt ? ago(health.daemon.startedAt).replace(/ ago$/, '') : 'unknown';
  const offline = health.daemon && health.daemon.running === false;
  if (!offline && !bad.length && !warnings.length) {
    $('daemonList').innerHTML = `<div class="daemon-summary">all ok · uptime ${esc(uptime)}</div>`;
    return;
  }
  const rank = { failing: 0, silent: 1, never: 2, warning: 3, skipped: 4, ok: 5, disabled: 6 };
  rows.sort((a, b) => (rank[a.displayState] ?? 9) - (rank[b.displayState] ?? 9) || a.name.localeCompare(b.name));
  const lastStart = health.daemon && health.daemon.startedAt ? ago(health.daemon.startedAt) : 'never';
  const offlineSummary = offline ? `<div class="daemon-summary bad">offline · last start ${esc(lastStart)}</div>` : '';
  $('daemonList').innerHTML = offlineSummary + rows.map((row) => {
    const isBad = badStates.has(row.displayState);
    const isWarning = row.displayState === 'warning';
    const lastRun = row.lastRunAt ? ago(row.lastRunAt) : 'never';
    const lastOk = row.lastOkAt ? ago(row.lastOkAt) : 'never';
    return `<div class="daemon-row${isBad ? ' bad' : isWarning ? ' warning' : ''}" title="${esc(row.displayDetail)}">
      <span class="daemon-name">${esc(row.name)}</span><span class="daemon-state">${esc(row.displayState)}</span>
      <span class="daemon-time">run ${esc(lastRun)}</span><span class="daemon-time">ok ${esc(lastOk)}</span>
      ${row.displayDetail ? `<span class="daemon-detail">${esc(row.displayDetail)}</span>` : ''}
    </div>`;
  }).join('');
}

function attentionItemKey(item) {
  return item.id ? `${item.id}:${item.since || item.at}` : `${item.kind}:${item.sessionId || item.taskId || ''}:${item.since}`;
}

function attentionSnoozes() {
  const now = Date.now();
  let parsed = {};
  try { parsed = JSON.parse(localStorage.keepAttnSnooze || '{}'); } catch {}
  const snoozes = Object.create(null);
  if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
    for (const [key, expiry] of Object.entries(parsed)) {
      if (Number.isFinite(expiry) && expiry > now) snoozes[key] = expiry;
    }
  }
  try {
    if (Object.keys(snoozes).length) localStorage.keepAttnSnooze = JSON.stringify(snoozes);
    else localStorage.removeItem('keepAttnSnooze');
  } catch {}
  return snoozes;
}

function snoozeAttentionItem(item) {
  const snoozes = attentionSnoozes();
  snoozes[attentionItemKey(item)] = Date.now() + 30 * 60e3;
  localStorage.keepAttnSnooze = JSON.stringify(snoozes);
}

function attentionHeader(count) {
  return `<div class="attention-hdr"><span>Needs you <span class="n">${count}</span></span>
    <span class="attention-toggle" aria-label="Attention controls">
      <button type="button" class="chip ${attentionView === 'focus' ? 'on' : ''}" data-attn-view="focus">Focus</button>
      <button type="button" class="chip ${attentionView === 'list' ? 'on' : ''}" data-attn-view="list">List</button>
      <button type="button" class="chip ${attentionMax ? 'on' : ''}" data-attn-max aria-label="Toggle fullscreen Needs you" aria-pressed="${attentionMax}" title="Fill the page with Needs you">⛶</button>
    </span>
  </div>`;
}

function syncAttentionMax(hasItems = (state.attention || []).length > 0) {
  const active = attentionMax && hasItems;
  document.body.classList.toggle('attn-max', active);
  const button = $('attention').querySelector('[data-attn-max]');
  if (button) {
    button.classList.toggle('on', active);
    button.setAttribute('aria-pressed', String(active));
  }
}

function setAttentionMax(maximized) {
  attentionMax = maximized;
  if (attentionMax) localStorage.keepAttnMax = '1';
  else localStorage.removeItem('keepAttnMax');
  syncAttentionMax();
}

function renderAttentionList(items) {
  const rows = [];
  for (const pri of [...new Set(items.map((i) => i.pri))]) {
    const tier = items.filter((i) => i.pri === pri);
    const shown = pri >= 1 ? tier.slice(0, 4) : tier;
    for (const i of shown) {
      const safePri = [0, 1, 2, 3].includes(i.pri) ? i.pri : 3;
      const s = i.sessionId ? (state.sessions || []).find((x) => x.id === i.sessionId) : null;
      const task = i.taskId ? (state.tasks || []).find((t) => t.id === i.taskId) : null;
      const rowSession = i.sessionId ? (state.sessions || []).find((x) => x.id === i.sessionId) : null;
      let name = i.sessionId
        ? ((rowSession && rowSession.title) ? `${rowSession.title} · ${projName(i.project)}` : ((task && task.fm && task.fm.title) || projName(i.project)))
        : i.title;
      let detail = i.detail || '';
      let extra = '';
      let title = '';
      if (i.kind === 'question') {
        detail = i.question || '';
        extra = Array.isArray(i.options) && i.options.length
          ? `<div class="attention-options">${i.options.map((o, idx) => i.codex
            ? `<span class="attention-option-text">${esc(o)}</span>`
            : `<button type="button" class="attention-option" data-opt="${idx + 1}" title="Answer the question in that session">${esc(o)}</button>`).join('')}</div>`
          : '';
        if (!i.codex) title = ' title="Answer in the session\'s terminal"';
      } else if (i.kind === 'permission' && i.codex) {
        extra = `<div class="attention-options">
          <button type="button" class="attention-option" data-approval="yes">Approve</button>
          <button type="button" class="attention-option" data-approval="always">Always allow</button>
          <button type="button" class="attention-option" data-approval="no">Deny</button>
        </div><div class="focus-error attention-action-error" style="display:none"></div>`;
      } else if (i.kind === 'plan') detail = 'Plan ready for approval';
      else if (i.kind === 'input') detail = s && s.lastAssistant || 'Waiting for input';
      rows.push(`<div class="attention-row pri-${safePri}" data-key="${esc(attentionItemKey(i))}"${i.sessionId ? ` data-sid="${esc(i.sessionId)}"` : i.taskId ? ` data-id="${esc(i.taskId)}"` : ''}${title}>
        <div class="attention-proj">${i.codex ? '<span class="source-chip">codex</span> ' : ''}${esc(name)}</div>
        <div class="attention-detail">${esc(detail)}${extra}</div>
        <div class="attention-tail"><span class="attention-time">${esc(attentionTime(i.since))}</span><button type="button" class="attention-ack" data-action="ack" title="Hide this until it has new activity" aria-label="Done for now">✓</button></div>
      </div>`);
    }
    if (shown.length < tier.length) rows.push(`<div class="attention-more">+${tier.length - shown.length} more</div>`);
  }
  $('attention').innerHTML = `${attentionHeader(items.length)}${rows.join('')}`;
}

function renderAttentionFocus(items) {
  const snoozes = attentionSnoozes();
  const available = items.filter((item) => !snoozes[attentionItemKey(item)]);
  const renderedCard = $('attention').querySelector('.focus-card');
  if (focusPinned && renderedCard && renderedCard.dataset.key === focusPinned.key) {
    const pinnedItem = focusPinned.item;
    const stillNeedsAttention = available.some((item) => attentionItemKey(item) === attentionItemKey(pinnedItem));
    if (stillNeedsAttention) {
      const count = $('attention').querySelector('.attention-hdr .n');
      const progress = $('attention').querySelector('.focus-progress');
      if (count) count.textContent = String(items.length);
      if (progress) progress.textContent = `1 of ${available.length}`;
      return;
    }
    focusPinned = null;
  }
  if (!available.length) {
    focusPinned = null;
    const snoozedCount = items.filter((item) => snoozes[attentionItemKey(item)]).length;
    const caughtUpDetail = snoozedCount
      ? `<div class="focus-body">${snoozedCount} snoozed</div><button type="button" class="attention-unsnooze" data-action="unsnooze">Unsnooze all</button>`
      : '<div class="focus-body">You’re caught up.</div>';
    $('attention').innerHTML = `${attentionHeader(items.length)}<div class="focus-wrap"><div class="focus-caught">
      <div class="focus-name">Nothing needs you right now</div>
      ${caughtUpDetail}
    </div></div>`;
    return;
  }

  const item = available[0];
  const key = attentionItemKey(item);
  focusPinned = { item, key };
  const safePri = [0, 1, 2, 3].includes(item.pri) ? item.pri : 3;
  const session = item.sessionId ? (state.sessions || []).find((s) => s.id === item.sessionId) : null;
  const task = item.taskId ? (state.tasks || []).find((t) => t.id === item.taskId) : null;
  const labels = { question: 'QUESTION', permission: 'PERMISSION', complete: 'COMPLETED', plan: 'PLAN', input: 'WAITING', review: 'REVIEW', blocked: 'BLOCKED', overdue: 'OVERDUE', unblocked: 'UNBLOCKED', health: 'DAEMON HEALTH', stalled: 'STALLED' };
  const name = item.sessionId
    ? ((session && session.title) || (task && task.fm && task.fm.title) || projName(item.project) || (session && session.lastUser) || 'Coding session')
    : (item.title || (task && task.fm && task.fm.title) || 'Keep task');
  let body = '';
  let actions = '';
  const snippet = (text) => {
    const value = String(text || '');
    if (!value) return '';
    return `<div class="focus-snippet md">${md(value)}</div>`;
  };

  if (item.kind === 'question') {
    body = `<div class="focus-body md">${md(item.question || '')}</div>`;
    if (Array.isArray(item.options) && item.codex && item.options.length) {
      body += `<div class="attention-options">${item.options.map((option) => `<span class="attention-option-text">${esc(option)}</span>`).join('')}</div>`;
    } else if (Array.isArray(item.options)) {
      actions += item.options.map((option, idx) =>
        `<button type="button" class="btn focus-action focus-answer" data-action="answer" data-opt="${idx + 1}">${esc(option)}</button>`).join('');
    }
  } else if (item.kind === 'input') {
    body = snippet(session && (session.lastAssistantFull || session.lastAssistant) || 'Waiting for input');
    actions += `<span class="focus-reply"><input type="text" class="focus-reply-input" maxlength="2000" placeholder="Reply to this session"><button type="button" class="btn focus-action" data-action="send">Send</button></span>`;
  } else if (item.kind === 'complete') {
    body = snippet(item.detail || (session && (session.lastAssistantFull || session.lastAssistant)) || 'Codex finished.');
    if (item.taskId) actions += `<button type="button" class="btn focus-action" data-action="open-task">Open task</button>`;
  } else if (item.kind === 'permission') {
    body = `<div class="focus-body">${esc(item.detail || '')}</div>`;
    if (item.codex) {
      actions += `<button type="button" class="btn focus-action" data-action="codex-approval" data-approval="yes">Approve</button>
        <button type="button" class="btn quiet focus-action" data-action="codex-approval" data-approval="always">Always allow</button>
        <button type="button" class="btn quiet focus-action" data-action="codex-approval" data-approval="no">Deny</button>`;
    }
  } else if (item.kind === 'plan') {
    const planText = session && (session.lastAssistantFull || session.lastAssistant);
    body = `<div class="focus-body">Plan ready for approval</div>${snippet(planText)}`;
  } else {
    body = `<div class="focus-body">${esc(item.detail || (task && task.lastLog) || '')}</div>`;
    if (item.taskId) actions += `<button type="button" class="btn focus-action" data-action="open-task">Open task</button>`;
    if (item.kind === 'review' && item.taskId) actions += `<button type="button" class="btn quiet focus-action" data-action="mark-done">Mark done in Keep</button>`;
  }

  if (item.sessionId) {
    const primary = item.kind === 'permission' || item.kind === 'plan';
    actions += `<button type="button" class="btn ${primary ? '' : 'quiet '}focus-action" data-action="open-session">Open session</button>`;
    if (!item.codex && ['input', 'plan', 'question', 'permission'].includes(item.kind)) {
      actions += `<button type="button" class="btn quiet focus-action" data-action="tail">Recent conversation</button>`;
    }
  }
  // task-backed cards: "Done for now" reads like a task-state change (it isn't) — say what it does
  actions += `<button type="button" class="btn quiet focus-action" data-action="ack" title="Hide this until it has new activity">${item.taskId && !item.sessionId ? 'Hide until update' : 'Done for now'}</button>`;
  actions += `<button type="button" class="btn quiet focus-action" data-action="skip">Skip</button>`;

  $('attention').innerHTML = `${attentionHeader(items.length)}<div class="focus-wrap">
    <div class="focus-progress">1 of ${available.length}</div>
    <div class="focus-card pri-${safePri}" data-key="${esc(key)}">
      <div class="focus-top"><span class="focus-kind">${esc(labels[item.kind] || String(item.kind || '').toUpperCase())}</span>${item.codex ? '<span class="source-chip">codex</span>' : ''}${item.sessionId && session && session.title ? `<span class="focus-proj">${esc(projName(item.project))}</span>` : ''}<span class="focus-time">${esc(attentionTime(item.since))}</span></div>
      <div class="focus-name">${esc(name)}</div>
      ${body}
      <div class="focus-actions">${actions}</div>
      <div class="focus-error" style="display:none"></div>
    </div>
  </div>`;
}

function renderAttention() {
  const items = state.attention || [];
  const hasItems = items.length > 0;
  $('attention').style.display = '';
  syncAttentionMax(hasItems);
  const reply = $('attention').querySelector('.focus-reply-input');
  if (attentionView === 'focus' && reply && (document.activeElement === reply || reply.value)) return;
  if (!hasItems) {
    focusPinned = null;
    renderAttentionFocus(items);
  } else if (attentionView === 'focus') renderAttentionFocus(items);
  else renderAttentionList(items);
}

function sessionInNow(session, now = Date.now()) {
  if (session.exited || session.deadMidTurn || ['exited', 'inactive', 'recent'].includes(session.state)) return false;
  return ['running', 'waiting', 'needs-input'].includes(session.state) || now - session.mtime < 3600e3;
}

function render() {
  $('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  renderUsage();
  renderAttention();
  renderDaemon();

  const unblockEntries = state.unblocked || [];
  $('unblockedBox').style.display = unblockEntries.length ? '' : 'none';
  $('unblockedList').innerHTML = unblockEntries.map((record) => {
    const status = record.state === 'gaveUp' ? 'gave up' : record.state;
    const muted = record.state === 'delivered' ? ' delivered' : '';
    return `<div class="unblocked-row${muted}"><span>${esc(record.dependent)}</span><span>${esc(record.upstream)}</span><span>${esc(status)}</span><span>${esc(record.attempts)} attempts</span></div>`;
  }).join('');

  const alertEntries = [...(state.alerts || [])].reverse();
  $('alertsBox').style.display = alertEntries.length || state.brief ? '' : 'none';
  $('alertBrief').textContent = state.brief && state.brief.text ? state.brief.text : '';
  $('alertList').innerHTML = alertEntries.map((entry) => {
    const outcome = entry.deferred ? `deferred${entry.why ? ` · ${entry.why}` : ''}` : (entry.channels || []).join(', ') || 'no channel';
    return `<div class="alert-row"><span class="level">${esc(entry.level)}</span><span>${esc(ago(entry.at))}</span><span class="text" title="${esc(entry.text)}">${esc(entry.text)}</span><span>${esc(outcome)}</span></div>`;
  }).join('');

  const standup = state.standup;
  $('standupBox').style.display = standup ? '' : 'none';
  $('standupText').textContent = standup && standup.text || '';
  $('standupMeta').textContent = standup
    ? `generated ${pacificTime(standup.generatedAt)} · since ${pacificTime(standup.since)}` : '';
  $('standupLinks').innerHTML = standup ? (standup.cards || []).map((id) => {
    const task = state.tasks.find((item) => item.id === id);
    return `<button type="button" class="standup-link" data-id="${esc(id)}">▸ ${esc(task && task.fm.title || id)}</button>`;
  }).join('') : '';

  const slackEntries = [...(state.slack && state.slack.recent || [])].reverse();
  $('slackBox').style.display = slackEntries.length || (state.slack && state.slack.lastPollAt) ? '' : 'none';
  $('slackMeta').textContent = state.slack ? `· ${state.slack.mode} · ${state.slack.lastPollAt ? ago(state.slack.lastPollAt) : 'not polled'}` : '';
  $('slackList').innerHTML = slackEntries.map((entry) => {
    const related = `${(entry.related || []).length} related${entry.cardId ? ` · ${entry.cardId}` : ''}`;
    return `<div class="slack-row"><span>${esc(ago(entry.at))}</span><span>${esc(entry.channel)}</span><span>${esc(entry.from)}</span><span class="kind">${esc(entry.kind)} · ${esc(entry.severity)}</span><span class="summary" title="${esc(entry.summary)}">${esc(entry.summary)}</span><span>${esc(related)}</span></div>`;
  }).join('');

  if (state.digest) {
    $('digestBox').style.display = '';
    const raw = md(state.digest.md || '');
    $('digestMd').innerHTML = state.digest.summary
      ? md(state.digest.summary) + `<details><summary style="cursor:pointer">Full digest</summary>${raw}</details>`
      : raw + (state.digest.summary === null ? '<div class="empty">summarizing…</div>' : '');
  } else $('digestBox').style.display = 'none';

  const live = (state.sessions || []).filter((session) => sessionInNow(session));
  $('nowCount').textContent = live.length ? `· ${live.filter((s) => s.state === 'running').length} running, ${live.filter((s) => s.state === 'idle').length} idle` : '';
  $('now').innerHTML = live.length ? live.map((s) => `
    <div class="sess ${s.state}" data-sid="${esc(s.id)}">
      <div class="top"><span class="dot"></span><span class="proj">${esc(projName(s.project))}</span></div>
      <div class="title"><span class="title-text">${esc(s.title || s.lastUser || '')}</span>${s.kind === 'codex' ? '<span class="source-chip">codex</span>' : ''}${s.stalled ? '<span class="source-chip stalled-chip">stalled</span>' : ''}</div>
      <div class="msg">${esc(s.lastAssistant || '')}</div>
      <div class="meta"><span>${esc(s.stateLabel || s.state)}</span><span>${ago(s.mtime)}</span>${s.gitBranch ? `<span>${esc(s.gitBranch)}</span>` : ''}${s.taskId ? `<span class="task">▸ ${esc(s.taskId)}</span>` : ''}</div>
    </div>`).join('') : '<div class="empty">no sessions active in the last hour</div>';

  const restore = state.tasks.filter((t) => ['active', 'review', 'landing'].includes(t.fm.status) && (t.fm.sessions || []).length);
  $('restoreBox').style.display = restore.length ? '' : 'none';
  const restoreSummary = state.resumeSummary ? `<div class="md summary-card" style="margin:.2rem 0 .7rem">${md(state.resumeSummary)}</div>` : '';
  $('restoreList').innerHTML = restoreSummary + restore.map((t) => {
    const s = t.fm.sessions[t.fm.sessions.length - 1];
    const cmd = `${t.fm.project ? `cd ${t.fm.project} && ` : ''}${s.agent === 'codex' ? 'codex resume' : 'claude --resume'} ${s.id}`;
    return `<div class="restore-item"><b>${esc(t.fm.title)}</b><span class="cmd" data-cmd="${esc(cmd)}" title="click to copy">${esc(cmd)}</span>${sessionOpenButton({ sessionId: s.id })}</div>`;
  }).join('');

  $('weeklyBox').style.display = state.weeklySummary ? '' : 'none';
  $('weeklyMd').innerHTML = state.weeklySummary ? md(state.weeklySummary) : '';

  const hasReview = state.tasks.some((t) => t.fm.status === 'review');
  $('reviewStrip').style.display = hasReview && state.reviewSummary ? '' : 'none';
  $('reviewStrip').innerHTML = hasReview && state.reviewSummary ? `<div class="review-hdr">Needs your review</div><div class="md">${md(state.reviewSummary)}</div>` : '';

  if (scopeFilter && !scopeNames().includes(scopeFilter)) scopeFilter = null;
  const scopes = scopeNames().map((s) =>
    `<button class="chip scope ${scopeFilter === s ? 'on' : ''}" data-scope="${esc(s)}">${esc(s)}</button>`).join('');
  const kindChip = `<button class="chip ${kindFilter === 'experiment' ? 'on' : ''}" data-kind="experiment" title="Only show experiment tasks">🧪 experiments</button>`;
  const tags = [...new Set(state.tasks.flatMap((t) => t.fm.tags || []))]
    .filter((t) => !scopeNames().includes(t)).sort();
  $('filters').innerHTML = scopes + kindChip + tags.map((t) =>
    `<button class="chip ${tagFilter === t ? 'on' : ''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');

  $('tagSummary').style.display = tagFilter && tagSummary ? '' : 'none';
  $('tagSummary').innerHTML = tagFilter && tagSummary ? `<div class="md">${md(tagSummary)}</div>` : '';

  const liveTaskIds = new Set(live.filter((s) => s.taskId).map((s) => s.taskId));
  const visible = state.tasks.filter((t) =>
    (!tagFilter || (t.fm.tags || []).includes(tagFilter)) &&
    (!scopeFilter || (t.fm.tags || []).includes(scopeFilter)) &&
    (!kindFilter || t.fm.kind === kindFilter));
  $('board').innerHTML = COLS.map((col) => {
    const items = visible.filter((t) => t.fm.status === col);
    return `<div class="col col-${col}">
      <div class="colh"><span class="name">${col}</span><span class="count">${items.length}</span></div>
      ${items.map((t) => {
        const updated = typeof t.fm.updated === 'string' ? new Date(t.fm.updated) : null;
        const ageMs = updated && Number.isFinite(updated.getTime()) ? Date.now() - updated.getTime() : NaN;
        const days = Number.isFinite(ageMs) && ageMs >= 0 ? Math.floor(ageMs / 864e5) : null;
        const stale = ['active', 'waiting', 'review', 'landing', 'blocked'].includes(t.fm.status) && days > STALE_DAYS;
        const landedShas = state.landed && Array.isArray(state.landed[t.id]) ? state.landed[t.id] : [];
        const closeDecision = state.landed && state.landed.decisions && state.landed.decisions[t.id];
        const landedTitle = [
          ...landedShas.map((item) => `${item.sha} → origin/${item.branch}`),
          ...(closeDecision ? [`would close: ${closeDecision.reason}`] : []),
        ].join('\n');
        return `
        <div class="card col-${col}" data-id="${esc(t.id)}">
          <div class="t">${esc(t.fm.title)}</div>
          <div class="meta">
            ${t.fm.kind && t.fm.kind !== 'task' ? `<span>[${esc(t.fm.kind)}]</span>` : ''}
            ${(t.fm.tags || []).map((x) => `<span class="tag">#${esc(x)}</span>`).join('')}
            ${(t.fm.depends_on || []).length ? `<span>waits on: ${esc(t.fm.depends_on.join(', '))}</span>` : ''}
            ${landedShas.length || closeDecision ? `<span class="landed-badge" title="${esc(landedTitle)}">landed${closeDecision ? ' · would close' : ''}</span>` : ''}
            ${t.fm.project ? `<span>${esc(projName(t.fm.project))}</span>` : ''}
            ${t.overdue ? `<span class="overdue">⏰ ${esc(t.fm.check_after.replace('T', ' '))}</span>` : ''}
            ${stale ? `<span class="stale">⏳ ${days}d</span>` : ''}
            ${liveTaskIds.has(t.id) ? '<span class="live">● live</span>' : ''}
          </div>
          ${t.lastLog ? `<div class="last">${esc(t.lastLog)}</div>` : ''}
          ${(() => { const r = runFor(t.id); return r && r.status === 'running'
            ? `<div class="runline"><span class="spin"></span><span>${esc(r.lastText || 'agent starting…')}</span></div>` : ''; })()}
        </div>`;
      }).join('') || '<div class="empty">—</div>'}
    </div>`;
  }).join('');
}

function loadTagSummary(tag) {
  fetch(`/api/tagsummary?tag=${encodeURIComponent(tag)}`).then((r) => {
    if (!r.ok) throw new Error(`request failed (${r.status})`);
    return r.json();
  }).then((j) => {
    if (tagFilter !== tag) return;
    tagSummary = j && j.text ? j.text : null;
    render();
  }).catch(() => {
    if (tagFilter !== tag) return;
    tagSummary = null;
    render();
  });
}

function toggleTag(t) {
  tagFilter = tagFilter === t ? null : t;
  tagSummary = null;
  render();
  if (tagFilter) loadTagSummary(tagFilter);
}

function toggleKind(kind) {
  kindFilter = kindFilter === kind ? null : kind;
  if (kindFilter) localStorage.keepKind = kindFilter;
  else localStorage.removeItem('keepKind');
  render();
}

function toggleScope(scope) {
  scopeFilter = scopeFilter === scope ? null : scope;
  if (scopeFilter) localStorage.keepScope = scopeFilter;
  else localStorage.removeItem('keepScope');
  render();
}

// delegated listeners: values live in data attributes, never in generated JS
$('filters').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  if (chip.dataset.scope) toggleScope(chip.dataset.scope);
  else if (chip.dataset.kind) toggleKind(chip.dataset.kind);
  else if (chip.dataset.tag) toggleTag(chip.dataset.tag);
});
$('board').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) openTask(card.dataset.id);
});
$('now').addEventListener('click', (e) => {
  const card = e.target.closest('.sess');
  if (card) openSession(card.dataset.sid);
});
$('attention').addEventListener('click', async (e) => {
  const maxButton = e.target.closest('[data-attn-max]');
  if (maxButton) {
    setAttentionMax(!attentionMax);
    return;
  }

  const viewButton = e.target.closest('[data-attn-view]');
  if (viewButton) {
    focusPinned = null;
    attentionView = viewButton.dataset.attnView === 'list' ? 'list' : 'focus';
    localStorage.keepAttnView = attentionView;
    renderAttention();
    return;
  }

  const focusAction = e.target.closest('[data-action]');
  if (focusAction) {
    const action = focusAction.dataset.action;
    if (action === 'tail') {
      const card = focusAction.closest('.focus-card');
      const item = card && focusPinned && focusPinned.key === card.dataset.key ? focusPinned.item : null;
      if (!card || !item || !item.sessionId) { toast('item is no longer available'); return; }
      const existing = card.querySelector('.focus-conversation');
      if (existing) {
        existing.remove();
        focusAction.textContent = 'Recent conversation';
        return;
      }
      focusAction.disabled = true;
      focusAction.textContent = 'Loading…';
      try {
        const response = await fetch(`/api/sessiontail?id=${encodeURIComponent(item.sessionId)}`);
        let result;
        try { result = await response.json(); } catch { result = {}; }
        if (!response.ok) throw new Error(result.error || `request failed (${response.status})`);
        card.insertAdjacentHTML('beforeend', `<div class="focus-conversation">${esc(result.text || '')}</div>`);
        focusAction.textContent = 'Hide conversation';
      } catch (err) {
        focusAction.textContent = 'Recent conversation';
        toast(String(err.message || 'request failed').slice(0, 300));
      } finally {
        if (focusAction.isConnected) focusAction.disabled = false;
      }
      return;
    }
    e.stopPropagation();
    if (focusAction.dataset.action === 'unsnooze') {
      focusPinned = null;
      localStorage.removeItem('keepAttnSnooze');
      renderAttention();
      return;
    }
    const card = focusAction.closest('.focus-card');
    const row = focusAction.closest('.attention-row');
    const container = card || row;
    const item = card
      ? (focusPinned && focusPinned.key === card.dataset.key ? focusPinned.item : null)
      : container && (state.attention || []).find((candidate) => attentionItemKey(candidate) === container.dataset.key);
    if (!item) { toast('item is no longer available'); return; }
    if (action === 'ack') {
      const actionButtons = card ? [...card.querySelectorAll('.focus-action')] : [focusAction];
      for (const button of actionButtons) button.disabled = true;
      try {
        const body = { kind: item.kind, since: item.since };
        if (item.id) body.id = item.id;
        else if (item.sessionId) body.sessionId = item.sessionId;
        else body.taskId = item.taskId;
        await post('/api/ack', body);
        focusPinned = null;
        toast('done for now');
        refresh();
      } catch (err) {
        toast(err.message);
      } finally {
        for (const button of actionButtons) {
          if (button.isConnected) button.disabled = false;
        }
      }
      return;
    }
    if (action === 'skip') {
      snoozeAttentionItem(item);
      focusPinned = null;
      renderAttention();
      return;
    }
    if (action === 'open-task') {
      if (item.taskId) openTask(item.taskId);
      return;
    }

    if (!card) return;
    const errorBox = card.querySelector('.focus-error');
    errorBox.style.display = 'none';
    const actionButtons = [...card.querySelectorAll('.focus-action')];
    for (const button of actionButtons) button.disabled = true;
    try {
      if (action === 'codex-approval') {
        const approval = focusAction.dataset.approval;
        if (!['yes', 'always', 'no'].includes(approval)) throw new Error('approval is no longer available');
        await post('/api/answer', { sessionId: item.sessionId, approval });
        focusPinned = null;
        toast(approval === 'no' ? 'denied' : 'approved');
        refresh();
      } else if (action === 'answer') {
        const option = Number(focusAction.dataset.opt);
        const label = Array.isArray(item.options) ? item.options[option - 1] : null;
        if (!label) throw new Error('question is no longer available');
        await post('/api/answer', { sessionId: item.sessionId, option, label });
        focusPinned = null;
        toast('answered');
        refresh();
      } else if (action === 'send') {
        const input = card.querySelector('.focus-reply-input');
        if (!input || !input.value.trim()) return;
        await post('/api/send', { sessionId: item.sessionId, text: input.value });
        input.value = '';
        input.blur();
        focusPinned = null;
        toast('sent');
        refresh();
      } else if (action === 'open-session') {
        const opened = await post('/api/open', { sessionId: item.sessionId });
        toast(opened.pane ? `session is in ${opened.pane}` : 'session opened');
      } else if (action === 'mark-done') {
        await post('/api/checkin', { id: item.taskId, message: 'Marked done from the focus card', status: 'done' });
        focusPinned = null;
        toast('marked done');
        refresh();
      }
    } catch (err) {
      const reason = String(err.message || 'request failed').slice(0, 300);
      const tail = String(err.data && err.data.screenTail || '').slice(-600);
      errorBox.innerHTML = `<div>${esc(reason)}</div>${tail ? `<pre>${esc(tail)}</pre>` : ''}`;
      errorBox.style.display = '';
      toast(reason);
    } finally {
      for (const button of actionButtons) {
        if (button.isConnected) button.disabled = false;
      }
    }
    return;
  }

  const approvalButton = e.target.closest('[data-approval]');
  if (approvalButton) {
    e.stopPropagation();
    const row = approvalButton.closest('.attention-row');
    const approval = approvalButton.dataset.approval;
    const item = row && (state.attention || []).find((candidate) =>
      candidate.kind === 'permission' && candidate.codex && attentionItemKey(candidate) === row.dataset.key);
    if (!item || !['yes', 'always', 'no'].includes(approval)) {
      toast('approval is no longer available');
      return;
    }
    const buttons = [...row.querySelectorAll('[data-approval]')];
    const errorBox = row.querySelector('.attention-action-error');
    for (const button of buttons) button.disabled = true;
    if (errorBox) errorBox.style.display = 'none';
    try {
      await post('/api/answer', { sessionId: item.sessionId, approval });
      toast(approval === 'no' ? 'denied' : 'approved');
      refresh();
    } catch (err) {
      const reason = String(err.message || 'request failed').slice(0, 300);
      const tail = String(err.data && err.data.screenTail || '').slice(-600);
      if (errorBox) {
        errorBox.innerHTML = `<div>${esc(reason)}</div>${tail ? `<pre>${esc(tail)}</pre>` : ''}`;
        errorBox.style.display = '';
      }
      toast(reason);
    } finally {
      for (const button of buttons) {
        if (button.isConnected) button.disabled = false;
      }
    }
    return;
  }

  const option = e.target.closest('.attention-option');
  if (option) {
    e.stopPropagation();
    const row = option.closest('.attention-row');
    if (!row || !row.dataset.sid) return;
    const index = Number(option.dataset.opt);
    const item = (state.attention || []).find((i) => i.kind === 'question' && i.sessionId === row.dataset.sid);
    const label = item && Array.isArray(item.options) ? item.options[index - 1] : null;
    if (!label) { toast('question is no longer available'); return; }
    option.disabled = true;
    try {
      await post('/api/answer', {
        sessionId: row.dataset.sid,
        option: index,
        label,
      });
      toast('answered');
      refresh();
    } catch (err) {
      toast(err.message);
      option.disabled = false;
    }
    return;
  }
  const row = e.target.closest('.attention-row');
  if (!row) return;
  if (row.dataset.sid) openSession(row.dataset.sid);
  else if (row.dataset.id) openTask(row.dataset.id);
});
$('attention').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target.matches('.focus-reply-input')) return;
  e.preventDefault();
  const card = e.target.closest('.focus-card');
  const send = card && card.querySelector('[data-action="send"]');
  if (send && !send.disabled) send.click();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('attn-max')) {
    e.preventDefault();
    setAttentionMax(false);
    return;
  }
  if (attentionView !== 'focus' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement && document.activeElement.matches('input, textarea')) return;
  const card = $('attention').querySelector('.focus-card');
  if (!card) return;
  let button = null;
  if (/^[1-9]$/.test(e.key)) button = card.querySelector(`[data-action="answer"][data-opt="${e.key}"]`);
  else if (e.key.toLowerCase() === 'n' || e.key.toLowerCase() === 'j') button = card.querySelector('[data-action="skip"]');
  else if (e.key.toLowerCase() === 'd') button = card.querySelector('[data-action="ack"]');
  if (button && !button.disabled) { e.preventDefault(); button.click(); }
});
$('restoreList').addEventListener('click', (e) => {
  const cmd = e.target.closest('.cmd');
  if (cmd) { navigator.clipboard.writeText(cmd.dataset.cmd); toast('copied'); }
});
$('standupLinks').addEventListener('click', (e) => {
  const link = e.target.closest('.standup-link');
  if (link) openTask(link.dataset.id);
});

// web notifications: fire when the tab is hidden and something changed state
let notifPrev = null;
const notifOn = () => localStorage.keepNotif === '1';
function renderNotifBtn() {
  $('notifBtn').style.opacity = notifOn() && Notification.permission === 'granted' ? '1' : '.45';
}
function maybeNotify() {
  const cur = {
    runs: new Map((state.runs || []).map((r) => [r.id, r.status])),
    overdue: new Set(state.tasks.filter((t) => t.overdue).map((t) => t.id)),
    review: new Set(state.tasks.filter((t) => t.fm.status === 'review').map((t) => t.id)),
  };
  if (notifPrev && notifOn() && document.hidden && Notification.permission === 'granted') {
    for (const [id, st] of cur.runs) {
      const old = notifPrev.runs.get(id);
      if (old === 'running' && st !== 'running') new Notification(`keep — run ${st}`, { body: id });
    }
    for (const id of cur.overdue) if (!notifPrev.overdue.has(id)) new Notification('keep — check overdue', { body: id });
    for (const id of cur.review) if (!notifPrev.review.has(id)) new Notification('keep — needs your review', { body: id });
  }
  notifPrev = cur;
}
$('notifBtn').addEventListener('click', async () => {
  if (notifOn()) {
    localStorage.keepNotif = '0';
    toast('notifications off');
  } else {
    const p = await Notification.requestPermission();
    if (p === 'granted') { localStorage.keepNotif = '1'; toast('notifications on'); }
    else toast('notification permission denied');
  }
  renderNotifBtn();
});
renderNotifBtn();

$('addBtn').addEventListener('click', () => $('addDlg').showModal());
$('afSubmit').addEventListener('click', async () => {
  try {
    const tags = $('afTags').value.split(/\s+/).map((s) => s.replace(/^#/, '')).filter(Boolean);
    await post('/api/add', {
      title: $('afTitle').value, kind: $('afKind').value, status: $('afStatus').value,
      tags, project: $('afProject').value || undefined,
      checkAfter: $('afCheckAfter').value || undefined, check: $('afCheck').value || undefined,
      note: $('afNote').value || undefined,
    });
    $('addDlg').close();
    for (const f of ['afTitle', 'afTags', 'afProject', 'afCheckAfter', 'afCheck', 'afNote']) $(f).value = '';
    toast('task added');
    refresh();
  } catch (e) { toast(e.message); }
});

function taskDraftState() {
  const active = $('detail').contains(document.activeElement) ? document.activeElement : null;
  const field = (id) => $(id) ? $(id).value : null;
  return {
    ciMsg: field('ciMsg'), ciStatus: field('ciStatus'), runExtra: field('runExtra'),
    focusId: active?.id || '', selectionStart: active?.selectionStart, selectionEnd: active?.selectionEnd,
  };
}

function restoreTaskDraft(draft) {
  if (!draft) return;
  for (const id of ['ciMsg', 'ciStatus', 'runExtra']) if ($(id) && draft[id] !== null) $(id).value = draft[id];
  const active = draft.focusId ? $(draft.focusId) : null;
  if (!active) return;
  active.focus({ preventScroll: true });
  if (Number.isInteger(draft.selectionStart) && typeof active.setSelectionRange === 'function') {
    active.setSelectionRange(draft.selectionStart, draft.selectionEnd);
  }
}

function openTask(id, draft = null) {
  const summary = state.tasks.find((x) => x.id === id);
  if (!summary) return;
  const request = ++taskDetailRequest;
  openTaskId = id;
  $('detail').dataset.sessionId = '';
  if (!summary._detailVersion) return renderTaskDetail(summary, draft);
  const priorVersion = $('detail').dataset.detailVersion || '';
  $('detail').dataset.detailVersion = summary._detailVersion;
  if (!draft) $('detail').innerHTML = `<button class="close" onclick="detail.close()">✕</button><h3>${esc(summary.fm.title)}</h3><div class="sub">${esc(summary.id)}</div><p class="empty" role="status">Loading task details…</p>`;
  if (!$('detail').open) $('detail').showModal();
  fetch(`/api/dashboard-detail?kind=task&id=${encodeURIComponent(id)}`, { headers: { 'x-keep': '1' } }).then(async (response) => {
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || `request failed (${response.status})`);
    return result;
  }).then((result) => {
    if (request !== taskDetailRequest || openTaskId !== id || !$('detail').open) return;
    renderTaskDetail({ ...summary, ...result.value }, draft ? taskDraftState() : null);
  }).catch((error) => {
    if (request !== taskDetailRequest || openTaskId !== id || !$('detail').open) return;
    if (draft) {
      $('detail').dataset.detailVersion = priorVersion;
      toast(`Could not refresh task details: ${error.message}`);
      return;
    }
    $('detail').innerHTML = `<button class="close" onclick="detail.close()">✕</button><h3>${esc(summary.fm.title)}</h3><div class="sub">${esc(summary.id)}</div><p role="alert">Could not load task details: ${esc(error.message)}</p><button class="btn" id="retryTaskDetail">Retry</button>`;
    $('retryTaskDetail').addEventListener('click', () => openTask(id));
  });
}

function renderTaskDetail(t, draft = null) {
  const id = t.id;
  openTaskId = id;
  $('detail').dataset.sessionId = '';
  $('detail').dataset.detailVersion = t._detailVersion || '';
  const s = (t.fm.sessions || []).slice(-1)[0];
  const resume = s ? `${t.fm.project ? `cd ${t.fm.project} && ` : ''}${s.agent === 'codex' ? 'codex resume' : 'claude --resume'} ${s.id}` : '';
  $('detail').innerHTML = `
    <button class="close" onclick="detail.close()">✕</button>
    <h3>${esc(t.fm.title)}</h3>
    <div class="sub">${esc(t.id)} · ${esc(t.fm.status)}${t.fm.kind !== 'task' ? ` · ${esc(t.fm.kind)}` : ''}${t.fm.project ? ` · ${esc(t.fm.project)}` : ''}${t.fm.check_after ? ` · check after ${esc(t.fm.check_after.replace('T', ' '))}` : ''}${(t.fm.depends_on || []).length ? ` · waits on ${esc(t.fm.depends_on.join(', '))}` : ''}</div>
    ${window.modelUsageHTML ? window.modelUsageHTML(t.modelUsage) : ''}
    ${experimentChip(t.fm.experiment_id)}
    <div class="actions">${resume ? `<div class="resume" title="click to copy" onclick="navigator.clipboard.writeText(this.textContent)">${esc(resume)}</div>` : ''}${sessionOpenButton(s ? { sessionId: s.id } : { taskId: t.id, fresh: true })}</div>
    <div id="taskSummary" class="md summary-card"><span class="empty">summarizing…</span></div>
    ${t.fm.check ? `<details class="recipe"><summary>Check recipe</summary><pre>${esc(t.fm.check)}</pre></details>` : ''}
    <div class="actions">
      <textarea id="ciMsg" placeholder="Check in: state + next step"></textarea>
    </div>
    <div class="actions">
      <select id="ciStatus">
        <option value="">keep status: ${esc(t.fm.status)}</option>
        ${COLS.concat('done').map((c) => `<option value="${c}">${c}</option>`).join('')}
      </select>
      <button class="btn" id="ciSend" title="Save your note above as a check-in on this task (and change status if you picked one). You are writing this — no agent runs.">Check in</button>
      <span class="spacer" style="flex:1"></span>
      ${t.fm.check ? '<button class="btn" id="runCheck" title="Spawn an agent to run this task&apos;s check recipe now — read-only verification (e.g. is it shipped?). The verdict lands as a check-in.">Run check now</button>' : ''}
      ${t.fm.project ? '<button class="btn" id="runTask" title="Spawn an agent to actually do this task in its project. It makes changes; the diff lands in review for you to inspect.">Run agent</button>' : ''}
    </div>
    ${t.fm.project ? '<div class="actions"><input type="text" id="runExtra" style="flex:1" placeholder="Optional instructions for the agent run (default: work from the task log)"></div>' : ''}
    <div id="runArea"></div>
    <div class="md">${md(t.body || '')}</div>`;

  $('ciSend').addEventListener('click', async () => {
    try {
      await post('/api/checkin', { id, message: $('ciMsg').value, status: $('ciStatus').value || undefined });
      $('detail').close();
      toast('checked in');
      refresh();
    } catch (e) { toast(e.message); }
  });
  if ($('runCheck')) $('runCheck').addEventListener('click', async () => {
    try { await post('/api/run', { id, kind: 'check' }); toast('check run started'); refresh(); }
    catch (e) { toast(e.message); }
  });
  if ($('runTask')) $('runTask').addEventListener('click', async () => {
    try { await post('/api/run', { id, kind: 'task', prompt: $('runExtra').value || undefined }); toast('agent run started'); refresh(); }
    catch (e) { toast(e.message); }
  });
  restoreTaskDraft(draft);

  renderRunArea(id);
  if (!$('detail').open) $('detail').showModal();
  fetch(`/api/tasksummary?id=${encodeURIComponent(id)}`).then((r) => {
    if (!r.ok) throw new Error(`request failed (${r.status})`);
    return r.json();
  }).then((j) => {
    const box = $('taskSummary');
    if (!box || openTaskId !== id) return;
    if (j.tooShort) box.style.display = 'none';
    else if (j.text) box.innerHTML = `<h2>Where this stands</h2>${md(j.text)}`;
    else box.innerHTML = '<span class="empty">summarizing…</span>';
  }).catch(() => {
    const box = $('taskSummary');
    if (box && openTaskId === id) box.style.display = 'none';
  });
}

function openSession(id) {
  const s = (state.sessions || []).find((x) => x.id === id);
  if (!s) return;
  openTaskId = null;
  $('detail').dataset.sessionId = id;
  const isCodex = s.kind === 'codex';
  const cmd = `${s.project ? `cd ${s.project} && ` : ''}${isCodex ? 'codex resume' : 'claude --resume'} ${s.id}`;
  $('detail').innerHTML = `
    <button class="close" onclick="detail.close()">✕</button>
    <h3>${esc(s.title || s.lastUser || 'Coding session')}</h3>
    <div class="sub">${esc(s.project || 'unknown project')}</div>
    ${isCodex ? '' : '<div id="sessionSummary" class="md summary-card"><span class="empty">summarizing…</span></div>'}
    ${s.lastAssistant ? `<div class="md"><h2>Last assistant update</h2><div class="runmsg">${esc(s.lastAssistant)}</div></div>` : ''}
    <div class="actions session-send">
      <input type="text" id="sessionMessage" maxlength="2000" placeholder="Message this session">
      <button type="button" class="btn" id="sessionSend" title="Types this into the running host pane, as if you typed it in the terminal, and presses Enter.">Send to session</button>
      <button type="button" class="btn quiet" id="sessionFocus">Focus session</button>
    </div>
    <div id="sessionSendError" class="session-error" style="display:none"></div>
    <div class="actions"><div class="resume" title="click to copy" onclick="navigator.clipboard.writeText(this.textContent)">${esc(cmd)}</div>${sessionOpenButton({ sessionId: s.id })}</div>`;
  const send = async () => {
    const input = $('sessionMessage');
    const button = $('sessionSend');
    const errorBox = $('sessionSendError');
    if (!input || !button || button.disabled || !input.value.trim()) return;
    button.disabled = true;
    errorBox.style.display = 'none';
    try {
      await post('/api/send', { sessionId: id, text: input.value });
      input.value = '';
      toast('sent');
    } catch (e) {
      const reason = String(e.message || 'request failed').slice(0, 300);
      const tail = String(e.data && e.data.screenTail || '').slice(-600);
      errorBox.innerHTML = `<div>${esc(reason)}</div>${tail ? `<pre>${esc(tail)}</pre>` : ''}`;
      errorBox.style.display = '';
      toast(reason);
    } finally {
      button.disabled = false;
    }
  };
  $('sessionSend').addEventListener('click', send);
  $('sessionMessage').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });
  $('sessionFocus').addEventListener('click', async () => {
    const button = $('sessionFocus');
    if (!button || button.disabled) return;
    button.disabled = true;
    try {
      const opened = await post('/api/open', { sessionId: id });
      toast(opened.pane ? `session is in ${opened.pane}` : 'session opened');
    } catch (e) {
      const errorBox = $('sessionSendError');
      const reason = String(e.message || 'request failed').slice(0, 300);
      const tail = String(e.data && e.data.screenTail || '').slice(-600);
      errorBox.innerHTML = `<div>${esc(reason)}</div>${tail ? `<pre>${esc(tail)}</pre>` : ''}`;
      errorBox.style.display = '';
      toast(reason);
    } finally {
      button.disabled = false;
    }
  });
  $('detail').showModal();
  if (isCodex) return;
  fetch(`/api/sessionsummary?id=${encodeURIComponent(id)}`).then((r) => {
    if (!r.ok) throw new Error(`request failed (${r.status})`);
    return r.json();
  }).then((j) => {
    const box = $('sessionSummary');
    if (!box || $('detail').dataset.sessionId !== id) return;
    box.innerHTML = j.text ? md(j.text) : '<span class="empty">summarizing…</span>';
  }).catch(() => {
    const box = $('sessionSummary');
    if (box && $('detail').dataset.sessionId === id) box.style.display = 'none';
  });
}

async function renderRunArea(taskId) {
  const area = $('runArea');
  if (!area) return;
  const r = runFor(taskId);
  if (!r) { area.innerHTML = ''; return; }
  const dur = Math.round(((r.endedAt || Date.now()) - r.startedAt) / 60e3);
  area.innerHTML = `
    <div class="runline">
      ${r.status === 'running' ? '<span class="spin"></span>' : ''}
      <b>${esc(r.kind)} run — ${esc(r.status)}</b>
      <span>${dur}m${r.costUsd != null ? ` · $${r.costUsd.toFixed(2)}` : ''}</span>
      ${r.status === 'running' ? `<button class="btn quiet" id="stopRun" title="Stop this running agent (kills the process; the task is marked blocked)">Stop</button>` : ''}
      ${r.diffStat ? `<button class="btn quiet" id="viewDiff" title="Show the file changes this agent run made">View diff</button>` : ''}
    </div>
    <div class="runmsg">${esc(r.status === 'running' ? (r.lastText || 'starting…') : (r.resultText || r.lastText || ''))}</div>
    <div id="diffHolder"></div>`;
  if ($('stopRun')) $('stopRun').addEventListener('click', async () => {
    try { await post('/api/stop', { id: taskId }); toast('stopping run'); } catch (e) { toast(e.message); }
  });
  if ($('viewDiff')) $('viewDiff').addEventListener('click', async () => {
    try {
      const resp = await fetch(`/api/rundiff?id=${encodeURIComponent(r.id)}`);
      const j = await resp.json();
      $('diffHolder').innerHTML = `<div class="diffpre">${esc(j.diff || j.error || '')}</div>`;
    } catch (e) { toast(e.message); }
  });
}

async function refresh() {
  try {
    const r = await fetch('/api/state?summary=1');
    state = await r.json();
    $('stale').style.display = 'none';
    render();
    maybeNotify();
    // keep the run area of an open modal live without clobbering the check-in form
    if ($('detail').open && openTaskId) {
      const summary = state.tasks.find((task) => task.id === openTaskId);
      if (summary?._detailVersion && summary._detailVersion !== $('detail').dataset.detailVersion) openTask(openTaskId, taskDraftState());
      else renderRunArea(openTaskId);
    }
  } catch {
    $('stale').style.display = '';
  }
}

function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = refresh;
  es.onerror = () => { $('stale').style.display = ''; };
}

refresh();
connect();
setInterval(refresh, 30000);
</script>
</body>
