<style>
  :root {
    --paper: #FAF9F5; --ink: #23252B; --muted: #5C6472; --accent: #A2691E;
    --accent-soft: #F3EADB; --line: #E4E1D8; --card: #FFFFFF; --code: #F1EFE8;
    --green: #3D7A46; --red: #B3402E; --warn: #A2691E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1B1D23; --ink: #E7E5DE; --muted: #9BA3B0; --accent: #D9A24A;
      --accent-soft: #2A2620; --line: #33363F; --card: #22242B; --code: #23262E;
      --green: #7DBB86; --red: #E07B6A; --warn: #D9A24A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding: 1.2rem 1.5rem .8rem; border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0; font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 1.5rem; font-weight: 600;
  }
  header h1 span { color: var(--accent); }
  header .date { color: var(--muted); }
  header .spacer { flex: 1; }
  header .stale { color: var(--red); font-size: .8rem; display: none; }
  .usage-strip {
    flex: 1 0 100%; min-height: 1.35rem; display: flex; align-items: center; gap: 1.1rem;
    overflow-x: auto; scrollbar-width: none; white-space: nowrap; color: var(--muted); font-size: .74rem;
  }
  .usage-strip::-webkit-scrollbar { display: none; }
  .usage-source { display: inline-flex; align-items: center; gap: .32rem; }
  .usage-name { color: var(--ink); font-weight: 650; }
  .usage-pill {
    border: 1px solid var(--line); border-radius: 999px; padding: .02rem .38rem;
    background: var(--code); color: var(--muted); line-height: 1.45;
  }
  .usage-pill.warm { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .usage-pill.hot { border-color: var(--red); color: var(--red); background: transparent; }
  .usage-asof { opacity: .68; margin-left: .08rem; }
  main { padding: 1rem 1.5rem 4rem; max-width: 1600px; margin: 0 auto; }
  h2 {
    font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 1.6rem 0 .6rem;
  }
  h2 .n { color: var(--accent); }

  /* digest */
  details.digest { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-top: 1rem; }
  details.digest summary {
    cursor: pointer; padding: .7rem 1rem; font-weight: 600; list-style: none;
    display: flex; gap: .6rem; align-items: baseline;
  }
  details.digest summary::before { content: "▸"; color: var(--accent); }
  details.digest[open] summary::before { content: "▾"; }
  details.digest .md { padding: 0 1.2rem 1rem; }

  /* attention */
  #attention { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-top: 1rem; overflow: hidden; }
  .attention-hdr { padding: .65rem .9rem; font-weight: 650; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .6rem; }
  .attention-hdr .n { color: var(--accent); margin-left: .3rem; }
  .attention-toggle { display: flex; gap: .25rem; margin-left: auto; }
  .attention-toggle .chip { padding: .05rem .55rem; }
  .attention-row {
    border-left: 4px solid var(--muted); padding: .55rem .8rem; cursor: pointer;
    display: grid; grid-template-columns: minmax(7rem, .25fr) minmax(0, 1fr) auto; gap: .7rem; align-items: baseline;
  }
  .attention-row + .attention-row, .attention-more { border-top: 1px solid var(--line); }
  .attention-row:hover { background: var(--accent-soft); }
  .attention-row.pri-0 { border-left-color: var(--red); }
  .attention-row.pri-1 { border-left-color: var(--accent); }
  .attention-proj { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attention-proj.has-experiment { white-space: normal; text-overflow: clip; overflow-wrap: anywhere; }
  .attention-detail { color: var(--muted); min-width: 0; }
  .attention-time { color: var(--muted); font-size: .72rem; white-space: nowrap; }
  .attention-tail { display: flex; align-items: center; gap: .4rem; }
  .attention-ack {
    border: 1px solid var(--line); border-radius: 5px; padding: 0 .3rem;
    font: inherit; font-size: .72rem; line-height: 1.35; color: var(--muted); background: transparent; cursor: pointer;
  }
  .attention-ack:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .attention-ack:disabled { opacity: .5; cursor: default; }
  .attention-options { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
  .attention-option {
    border: 1px solid var(--line); border-radius: 999px; padding: .05rem .45rem;
    font: inherit; font-size: .72rem; color: var(--muted); background: var(--card); cursor: pointer;
  }
  .attention-option:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .attention-option:disabled { opacity: .5; cursor: default; }
  .attention-option-text {
    border: 1px solid var(--line); border-radius: 999px; padding: .05rem .45rem;
    font-size: .72rem; color: var(--muted); background: var(--code);
  }
  .source-chip {
    display: inline-block; border: 1px solid var(--line); border-radius: 999px;
    padding: 0 .38rem; color: var(--muted); background: var(--code);
    font: 600 .64rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .04em; vertical-align: .08em; flex: none;
  }
  .source-chip.stalled-chip { border-color: var(--red); color: var(--red); background: transparent; }
  .attention-more { color: var(--muted); font-size: .76rem; padding: .35rem .8rem .35rem calc(.8rem + 4px); }
  .focus-wrap { padding: .8rem; }
  .focus-progress { color: var(--muted); font-size: .72rem; margin: 0 0 .45rem .25rem; }
  .focus-card {
    border: 1px solid var(--line); border-left: 5px solid var(--muted); border-radius: 9px;
    padding: .9rem 1rem; background: var(--card); min-width: 0; overflow-wrap: anywhere;
  }
  .focus-card.pri-0 { border-left-color: var(--red); }
  .focus-card.pri-1 { border-left-color: var(--accent); }
  .focus-top { display: flex; align-items: baseline; gap: .7rem; }
  .focus-kind { color: var(--accent); font-size: .68rem; letter-spacing: .12em; font-weight: 700; }
  .focus-proj { color: var(--muted); font-size: .72rem; font-weight: 600; }
  .focus-time { color: var(--muted); font-size: .72rem; margin-left: auto; white-space: nowrap; }
  .focus-name { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 1.18rem; font-weight: 650; margin-top: .2rem; }
  .focus-body { color: var(--muted); margin-top: .55rem; white-space: pre-wrap; }
  .focus-snippet { color: var(--muted); margin-top: .45rem; white-space: pre-wrap; }
  .focus-conversation {
    color: var(--text); background: var(--code); border: 1px solid var(--line); border-radius: 6px;
    padding: .65rem; margin-top: .75rem; max-height: 20rem; overflow: auto; white-space: pre-wrap;
  }
  .focus-actions { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; margin-top: .75rem; }
  .focus-reply { display: flex; gap: .45rem; flex: 1 1 22rem; min-width: min(100%, 18rem); }
  .focus-reply input { flex: 1; min-width: 0; }
  .focus-error { color: var(--red); font-size: .78rem; margin-top: .55rem; }
  .focus-error pre {
    color: var(--muted); background: var(--code); border: 1px solid var(--line); border-radius: 6px;
    padding: .5rem; margin: .35rem 0 0; white-space: pre-wrap; max-height: 12rem; overflow: auto;
  }
  .focus-caught { padding: 1.2rem 1rem; text-align: center; }
  .focus-caught .focus-name { margin: 0; }
  .focus-caught .focus-body { margin-top: .25rem; }
  .attention-unsnooze { border: 0; background: none; color: var(--accent); font: inherit; font-size: .78rem; cursor: pointer; padding: .45rem; }
  #unblockedBox { margin-top: .65rem; font-size: .78rem; }
  .unblocked-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto; gap: .55rem; padding-top: .35rem; }
  .unblocked-row.delivered { opacity: .55; }
  .unblocked-row span:first-child, .unblocked-row span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.attn-max { min-height: 100vh; display: flex; flex-direction: column; }
  body.attn-max main { flex: 1; width: 100%; max-width: none; display: flex; flex-direction: column; padding-bottom: 1rem; }
  body.attn-max main > :not(#attention) { display: none !important; }
  body.attn-max #attention { flex: 1; min-height: calc(100vh - 7rem); margin-top: 0; display: flex; flex-direction: column; }
  body.attn-max .focus-wrap { flex: 1; padding: clamp(1rem, 3vw, 2.5rem); }
  body.attn-max .focus-progress, body.attn-max .focus-card { width: 100%; max-width: 900px; margin-left: auto; margin-right: auto; }
  body.attn-max .focus-card { padding: clamp(1.1rem, 2.5vw, 2rem); }
  @media (max-width: 650px) {
    .attention-row { grid-template-columns: 1fr auto; gap: .15rem .6rem; }
    .attention-detail { grid-column: 1 / -1; }
    .focus-top { flex-wrap: wrap; gap: .25rem .7rem; }
    .focus-time { margin-left: 0; }
    .focus-reply { flex-basis: 100%; min-width: 100%; }
  }

  /* now strip */
  .now { display: flex; gap: .8rem; overflow-x: auto; padding-bottom: .4rem; }
  .sess {
    flex: 0 0 300px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); padding: .7rem .9rem; min-width: 0; cursor: pointer;
  }
  .sess:hover { border-color: var(--accent); }
  .sess .top { display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .running .dot { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .idle .dot { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .running .dot { animation: none; } }
  .sess .proj { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .title { color: var(--muted); font-size: .8rem; display: flex; align-items: center; gap: .35rem; min-width: 0; }
  .sess .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .msg {
    color: var(--muted); font-size: .78rem; margin-top: .35rem;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sess .meta { font-size: .72rem; color: var(--muted); margin-top: .35rem; display: flex; gap: .6rem; }
  .sess .task { color: var(--accent); }

  /* board */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: .9rem; align-items: start; }
  .col .colh { display: flex; gap: .4rem; align-items: baseline; margin-bottom: .5rem; }
  .col .colh .name { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 650; }
  .col .colh .count { color: var(--muted); font-size: .72rem; }
  .card {
    border: 1px solid var(--line); border-left: 3px solid var(--sc, var(--line));
    border-radius: 8px; background: var(--card); padding: .6rem .8rem;
    margin-bottom: .6rem; cursor: pointer; min-width: 0; overflow-wrap: anywhere;
  }
  .card:hover { border-color: var(--accent); }
  .card .t { font-weight: 600; }
  .card .meta { display: flex; flex-wrap: wrap; gap: .5rem; font-size: .72rem; color: var(--muted); margin-top: .25rem; }
  .card .tag { color: var(--accent); }
  .card .landed-badge {
    display: inline-block; padding: .02rem .38rem; background: var(--code);
    border: 1px solid var(--line); border-radius: 999px; color: var(--green); font-weight: 600;
  }
  .experiment-chip {
    display: inline-block; max-width: 100%; padding: .04rem .38rem; background: var(--code);
    border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
    font-family: ui-monospace, Menlo, monospace; font-size: .68rem; line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .card .overdue { color: var(--red); font-weight: 600; }
  .card .stale { color: var(--muted); font-weight: 600; }
  details.recipe { margin: .3rem 0 .2rem; }
  details.recipe summary { cursor: pointer; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  details.recipe pre { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--muted); background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: .5rem .7rem; margin: .4rem 0 0; overflow-x: auto; }
  .card .live { color: var(--green); font-weight: 600; }
  .card .last { color: var(--muted); font-size: .78rem; margin-top: .3rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .col-active { --sc: #3D7A46; } .col-review { --sc: #8A4FA3; } .col-blocked { --sc: #B3402E; }
  .col-landing { --sc: #2F6690; }
  .col-waiting { --sc: #C9962B; } .col-inbox { --sc: #4A7DA6; }

  /* filters */
  .filters { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .8rem; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: .1rem .7rem;
    font-size: .78rem; cursor: pointer; color: var(--muted); background: none; font-family: inherit;
  }
  .chip.scope { color: var(--ink); background: var(--code); font-weight: 600; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* detail modal */
  dialog {
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    max-width: 42rem; width: calc(100vw - 3rem); padding: 1.2rem 1.4rem;
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 .2rem; font-family: "Iowan Old Style", Palatino, Georgia, serif; }
  dialog .sub { color: var(--muted); font-size: .8rem; margin-bottom: .8rem; }
  dialog .resume {
    font-family: ui-monospace, Menlo, monospace; font-size: .78rem; background: var(--code);
    border: 1px solid var(--line); border-radius: 6px; padding: .5rem .7rem; margin: .6rem 0;
    overflow-x: auto; white-space: nowrap; cursor: pointer;
  }
  dialog .close { float: right; background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }

  /* actions & forms */
  .btn {
    border: 1px solid var(--accent); border-radius: 6px; background: none; color: var(--accent);
    padding: .3rem .8rem; font: inherit; font-size: .8rem; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn.quiet { border-color: var(--line); color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .6rem 0; }
  textarea, input[type=text], select {
    font: inherit; font-size: .85rem; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 6px; padding: .4rem .6rem;
  }
  textarea { width: 100%; min-height: 3.2rem; resize: vertical; }
  .field { display: flex; flex-direction: column; gap: .2rem; margin-bottom: .6rem; }
  .field label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .session-send { flex-wrap: nowrap; }
  .session-send input { flex: 1; min-width: 0; }
  .session-error { color: var(--red); font-size: .78rem; }
  .session-error pre {
    color: var(--muted); background: var(--code); border: 1px solid var(--line); border-radius: 6px;
    padding: .5rem; margin: .35rem 0 0; white-space: pre-wrap; max-height: 12rem; overflow: auto;
  }

  /* runs */
  .runline { display: flex; gap: .45rem; align-items: baseline; font-size: .78rem; margin-top: .3rem; color: var(--muted); }
  .spin {
    width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center;
    border: 2px solid var(--accent); border-top-color: transparent; animation: rot 1s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  #runArea { border-top: 1px solid var(--line); margin-top: .8rem; padding-top: .6rem; }
  .runmsg { font-size: .82rem; color: var(--muted); white-space: pre-wrap; margin: .4rem 0; }
  .diffpre {
    font-family: ui-monospace, Menlo, monospace; font-size: .72rem; background: var(--code);
    border: 1px solid var(--line); border-radius: 6px; padding: .6rem; overflow-x: auto;
    max-height: 40vh; overflow-y: auto; white-space: pre;
  }
  #toast {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); border-radius: 8px; padding: .5rem 1rem;
    font-size: .82rem; display: none; z-index: 10;
  }
  .restore-item { display: flex; gap: .8rem; align-items: baseline; padding: .3rem 0; flex-wrap: wrap; }
  .restore-item .cmd {
    font-family: ui-monospace, Menlo, monospace; font-size: .74rem; background: var(--code);
    padding: .15rem .5rem; border-radius: 5px; cursor: pointer;
  }
  .summary-card { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: .55rem .8rem; color: var(--muted); }
  .summary-card .md p:first-child { margin-top: 0; }
  .summary-card .md p:last-child { margin-bottom: 0; }
  #reviewStrip { margin: 1.4rem 0 -.8rem; }
  #reviewStrip .review-hdr { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 650; margin-bottom: .45rem; }
  #tagSummary { margin-top: .8rem; font-size: .82rem; }
  #alertsBox { margin-top: 1rem; font-size: .78rem; }
  .alerts-hdr { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 650; }
  .alert-brief { white-space: pre-wrap; margin-top: .45rem; }
  .alert-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: .55rem; padding-top: .35rem; color: var(--muted); }
  .alert-row .level { color: var(--ink); font-weight: 650; }
  .alert-row .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #standupBox { margin-top: 1rem; }
  .standup-text { color: var(--ink); margin-top: .45rem; line-height: 1.45; }
  .standup-meta { font-size: .72rem; margin-top: .4rem; }
  .standup-links { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
  .standup-link { border: 0; background: none; color: var(--accent); padding: 0; font: inherit; font-size: .74rem; cursor: pointer; }
  .standup-link:hover { text-decoration: underline; }
  #slackBox { margin-top: 1rem; font-size: .78rem; }
  .slack-row { display: grid; grid-template-columns: auto auto auto auto minmax(0, 1fr) auto; gap: .55rem; padding-top: .35rem; color: var(--muted); }
  .slack-row .kind { color: var(--ink); font-weight: 650; }
  .slack-row .summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #daemonBox { margin-top: 1rem; font-size: .78rem; }
  .daemon-summary { margin-top: .35rem; color: var(--muted); }
  .daemon-summary.bad { color: var(--red); }
  .daemon-row { display: grid; grid-template-columns: minmax(7rem, 1fr) auto minmax(5rem, auto) minmax(5rem, auto); gap: .55rem; padding-top: .35rem; align-items: baseline; }
  .daemon-row.warning { color: var(--warn); }
  .daemon-row.bad { color: var(--red); }
  .daemon-name { color: var(--ink); font-weight: 650; }
  .daemon-state { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 .4rem; font-size: .7rem; color: var(--muted); }
  .daemon-row.warning .daemon-state { border-color: var(--warn); color: var(--warn); }
  .daemon-row.bad .daemon-state { border-color: var(--red); color: var(--red); }
  .daemon-detail { grid-column: 1 / -1; color: inherit; overflow-wrap: anywhere; }
  .daemon-time { color: var(--muted); white-space: nowrap; }
  @media (max-width: 650px) {
    .daemon-row { grid-template-columns: minmax(0, 1fr) auto; }
    .daemon-row .daemon-time { grid-column: auto; }
  }
  #digestMd details { border-top: 1px solid var(--line); margin-top: .7rem; padding-top: .3rem; }
  #digestMd details summary { padding: .25rem 0; color: var(--muted); font-size: .78rem; }
  #digestMd details summary::before { content: none; }

  .md h1, .md h2, .md h3 { all: unset; display: block; font-weight: 700; margin: .7rem 0 .3rem; }
  .md h1 { font-size: 1.1rem; } .md h2 { font-size: .95rem; color: var(--accent); }
  .md h3 { font-size: .85rem; color: var(--accent); }
  .md ul, .md ol { margin: .2rem 0 .6rem; padding-left: 1.2rem; }
  .md code { background: var(--code); padding: .05em .3em; border-radius: 4px; font-size: .85em; }
  .md .mdcode { white-space: pre; font-family: ui-monospace, Menlo, monospace; font-size: .76rem; color: var(--muted); background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: .5rem .7rem; margin: .4rem 0; overflow-x: auto; }
  .md blockquote { border-left: 3px solid var(--line); color: var(--muted); margin: .4rem 0; padding-left: .7rem; }
  .md a { color: var(--accent); }
  .empty { color: var(--muted); padding: .6rem 0; }
</style>
</head>
<body>

    <div class="alerts-hdr">Alerts</div>

  <div id="standupBox" class="summary-card" style="display:none">

  <details class="digest" id="digestBox" style="display:none">

  <details class="digest" id="restoreBox" style="display:none">

</main>
<dialog id="detail"></dialog>
<dialog id="addDlg">
  <button class="close" onclick="addDlg.close()">✕</button>
  <h3>New task</h3>
  <div class="field"><label>Title</label><input type="text" id="afTitle"></div>
